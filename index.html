<script>
/* =========================================================
   DỮ LIỆU
   ========================================================= */

/* Từ vựng (flashcard) */
const VOCAB_BASE = [
  {w:'allocate',m:'phân bổ, cấp cho',ex:'The department was allocated a larger budget this year.'},
  {w:'invoice',m:'hóa đơn',ex:'Please send the invoice before the end of the month.'},
  {w:'reimburse',m:'hoàn trả chi phí',ex:'The company will reimburse your travel expenses.'},
  {w:'negotiate',m:'đàm phán',ex:'We are negotiating a new contract with the supplier.'},
  {w:'postpone',m:'hoãn lại',ex:'The meeting was postponed until next week.'},
  {w:'revenue',m:'doanh thu',ex:'Quarterly revenue rose by ten percent.'},
  {w:'warranty',m:'bảo hành',ex:'The laptop is covered by a two-year warranty.'},
  {w:'eligible',m:'đủ điều kiện',ex:'Only full-time staff are eligible for the bonus.'},
  {w:'inventory',m:'hàng tồn kho',ex:'The warehouse inventory is checked every month.'},
  {w:'merger',m:'sáp nhập',ex:'The merger created one of the largest banks in the region.'},
  {w:'discrepancy',m:'sự sai lệch',ex:'There is a discrepancy between the two reports.'},
  {w:'accommodate',m:'đáp ứng, chứa được',ex:'The new hall can accommodate 300 guests.'},
  {w:'enclosed',m:'được đính kèm',ex:'Please find the contract enclosed with this letter.'},
  {w:'tentative',m:'dự kiến, tạm thời',ex:'The tentative date for the launch is March 5.'},
  {w:'substantial',m:'đáng kể',ex:'The project required a substantial investment.'},
  {w:'expedite',m:'đẩy nhanh',ex:'We will expedite the shipment for an extra fee.'},
  {w:'retain',m:'giữ lại',ex:'The firm works hard to retain its best employees.'},
  {w:'surpass',m:'vượt qua',ex:'Sales surpassed our expectations in the second quarter.'},
  {w:'liable',m:'chịu trách nhiệm pháp lý',ex:'The owner is liable for any damage to the property.'},
  {w:'complimentary',m:'miễn phí (tặng kèm)',ex:'Breakfast is complimentary for all hotel guests.'},
  {w:'prior to',m:'trước khi',ex:'Please review the policy prior to your first day.'},
  {w:'implement',m:'triển khai',ex:'The team will implement the new system next month.'},
  {w:'appoint',m:'bổ nhiệm',ex:'The board appointed a new chief financial officer.'},
  {w:'outstanding',m:'xuất sắc; chưa thanh toán',ex:'The customer still has an outstanding balance.'},
  {w:'hinder',m:'cản trở',ex:'Bad weather may hinder the delivery of goods.'},
  {w:'commence',m:'bắt đầu',ex:'Construction will commence in early spring.'},
  {w:'proofread',m:'soát lỗi',ex:'Please proofread the document before printing.'},
  {w:'forfeit',m:'mất (quyền, tiền cọc)',ex:'You may forfeit the deposit if you cancel late.'}
];

/* Bộ từ vựng đầy đủ: 28 từ mẫu + 1000 từ trong vocab.js */
/* Nếu thiếu vocab.js thì app vẫn chạy với 28 từ mẫu, không bị trắng trang */
const VOCAB_MISSING = typeof VOCAB_EXTRA === 'undefined';
let VOCAB = [], GROUPS = [];   // tạo lại trong buildVocab() sau khi đã có dữ liệu S

/* ---- Chuyển IPA sang cách đọc bằng chữ (ước lượng gần đúng, trọng âm viết HOA) ---- */
const IPA_MAP = [
  ['tʃ',''], ['dʒ','j'], ['ɪər','ia'], ['ɪr','ia'], ['ɜːr','ơ'], ['ɜr','ơ'], ['ɝ','ơ'], ['ɚ','ơ'],
  ['ər','ơ'], ['ɔːr','o'], ['ɔr','o'], ['ɑr','a'], ['ɛr','e'], ['er','e'], ['ʊər','ua'], ['ʊr','u'],
  ['oʊ','ô'], ['əʊ','ô'], ['aɪ','ai'], ['eɪ','ây'], ['aʊ','ao'], ['ɔɪ','oi'], ['iː','i'], ['uː','u'],
  ['ɑː','a'], ['ɔː','o'], ['ɪ','i'], ['ɛ','e'], ['æ','a'], ['ɑ','a'], ['ɒ','o'], ['ɔ','o'], ['ʌ','ă'],
  ['ə','ơ'], ['ʊ','u'], ['θ',''], ['ð',''], ['ʃ',''], ['ʒ',''], ['ŋ',''],
  ['j','y'], ['ɡ','g'], ['ɹ','r'], ['ɾ','t'], ['ˈ','|'], ['ˌ','|'], ['ː','']
];
const IPA_SORTED = [...IPA_MAP].sort((a, b) => b[0].length - a[0].length);
const DIGRAPH_BACK = {'':'ch','':'sh','':'th','':'ng','':'zh'};

/* Hai nguyên âm đứng sát nhau (ví dụ ɪ + ə) được đánh dấu là hai âm tiết riêng */
const IPA_VOWEL = 'ɜːr|ɪər|ʊər|ɔːr|ɜː|ɪr|ər|ɔr|ɑr|ɛr|iː|uː|ɑː|ɔː|oʊ|əʊ|aɪ|eɪ|aʊ|ɔɪ|ɪ|ɛ|æ|ɑ|ɒ|ɔ|ʌ|ə|ʊ|ɜ|i|u|e|o|a';
const SYL_MARK = '';
const VOWEL_TOKENS = IPA_VOWEL.split('|').sort((a, b) => b.length - a.length);
function markSyllables(s){
  let out = '', i = 0, prevVowel = false;
  while (i < s.length) {
    const v = VOWEL_TOKENS.find(tok => s.startsWith(tok, i));
    if (v) {
      if (prevVowel) out += SYL_MARK;
      out += v; i += v.length; prevVowel = true;
    } else {
      out += s[i]; i++; prevVowel = false;
    }
  }
  return out;
}

function respell(ipa){
  if (!ipa) return '';
  return ipa.replace(/\//g, '').trim().split(/\s+/).map(w => {
    let t = markSyllables(w);
    IPA_SORTED.forEach(([a, b]) => { t = t.split(a).join(b); });
    const parts = t.split(/([aeiouơăôâê]+y?)/);
    const cl = [], vs = [];
    parts.forEach((p, k) => (k % 2 === 0 ? cl : vs).push(p));
    const n = vs.length;
    if (n === 0) return t.replace(/\||/g, '');
    const stressed = new Set();
    cl.forEach((c, i) => { if (c.includes('|')) stressed.add(i); });
    const clean = cl.map(c => c.replace(/\||/g, ''));
    const onset = [], coda = [];
    onset[0] = clean[0];
    for (let i = 1; i < n; i++) {
      const c = clean[i];
      if (cl[i].includes(SYL_MARK)) { coda[i-1] = ''; onset[i] = c; }
      else if (c.length >= 2) { coda[i-1] = c[0]; onset[i] = c.slice(1); }
      else { coda[i-1] = ''; onset[i] = c; }
    }
    coda[n-1] = clean[n];
    const out = [];
    for (let i = 0; i < n; i++) {
      let s = onset[i] + vs[i] + coda[i];
      s = s.replace(/[-]/g, ch => DIGRAPH_BACK[ch]);
      out.push(stressed.has(i) ? s.toUpperCase() : s);
    }
    return out.join('-');
  }).join(' ');
}

/* ---- Lặp ngắt quãng (SRS): mỗi từ có hộp 0–5, mỗi hộp là một khoảng chờ tính bằng ngày ---- */
const DAY_MS = 86400000;
const VOCAB_INTERVALS = [0, 1, 3, 7, 14, 30];  // hộp 0: mới hoặc vừa sai; hộp 5: chờ 30 ngày
const KNOWN_BOX = 3;                            // từ ở hộp 3 trở lên (chờ từ 3 ngày) được tính là đã thuộc
const GROUP_SIZE = 20;
const GROUP_UNLOCK = 0.8;                       // nhóm kế tiếp mở khi nhóm trước đạt 80%
const LOCK_MSG = 'Nhóm này đang khóa. Hãy thuộc ít nhất 80% nhóm trước, hoặc tắt "Khóa nhóm tiếp theo" trên thanh công cụ.';
function isDue(e, now){ return !e || e.due <= now; }
function isKnown(e){ return !!e && e.box >= KNOWN_BOX; }
/* Trạng thái mới của một từ sau khi người học đánh giá: 'again' (chưa biết), 'hard' (khó), 'good' (biết) */
function gradeEntry(e, grade, now){
  const cur = e || {box: 0, seen: 0, wrong: 0};
  let box = cur.box || 0, due;
  if (grade === 'again') { box = 0; due = now; }
  else if (grade === 'hard') { box = Math.max(0, box - 1); due = now + (box === 0 ? 10 * 60000 : VOCAB_INTERVALS[box] * DAY_MS); }
  else { box = Math.min(5, box + 1); due = now + VOCAB_INTERVALS[box] * DAY_MS; }
  return {box, due, seen: (cur.seen || 0) + 1, wrong: (cur.wrong || 0) + (grade === 'again' ? 1 : 0)};
}

/* =========================================================
   GÓI NỘI DUNG (câu ví dụ, cụm từ, từ dễ nhầm, giọng thật, câu hỏi mới)
   Mỗi mục bắt buộc ghi nguồn ("src"). Khối giữa hai dấu mốc được tools/validate-pack.js dùng lại.
   ========================================================= */
/*PACK-VALIDATOR-BEGIN*/
const AUDIO_RE = /^audio\/[A-Za-z0-9_\-\/]+\.(mp3|ogg|m4a|wav)$/;
const PACK_IMG_RE = /^images\/[A-Za-z0-9_\-\/]+\.(png|jpe?g|webp|gif)$/;
function packContains(text, key){
  let stem = key.split(/[ -]/)[0];
  stem = stem.slice(0, Math.max(3, stem.length - 3));
  return text.toLowerCase().includes(stem);
}
function validatePack(raw){
  const out = {name: '', words: {}, qs: []}, errors = [];
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {pack: out, errors: ['Gói phải là một đối tượng JSON.']};
  if (raw._template === true) errors.push('Đây là file mẫu: hãy thay nội dung thật và xóa dòng "_template".');
  if (raw.version !== 1) errors.push('Thiếu "version": 1.');
  out.name = typeof raw.name === 'string' ? raw.name.trim().slice(0, 80) : '';
  const str = (v, max) => typeof v === 'string' ? v.trim().slice(0, max) : '';
  const list = (v, max) => Array.isArray(v) ? v.slice(0, max) : [];
  if (raw._template === true) return {pack: {name: '', words: {}, qs: []}, errors};
  list(raw.words, 5000).forEach((x, i) => {
    const tag = 'words[' + i + ']';
    if (!x || typeof x.w !== 'string' || !/^[A-Za-z][A-Za-z' -]{0,59}$/.test(x.w.trim())) { errors.push(tag + ': thiếu hoặc sai "w".'); return; }
    const key = x.w.trim().toLowerCase();
    const e = {ex: [], col: [], conf: [], audio: ''};
    list(x.ex, 3).forEach((it, j) => {
      const t = str(it && it.t, 200), src = str(it && it.src, 120);
      if (t.length < 10) errors.push(`${tag}.ex[${j}]: câu quá ngắn hoặc thiếu "t".`);
      else if (!src) errors.push(`${tag}.ex[${j}]: thiếu "src" (nguồn).`);
      else if (!packContains(t, key)) errors.push(`${tag}.ex[${j}]: câu không chứa từ "${key}".`);
      else e.ex.push({t, src});
    });
    list(x.col, 6).forEach((it, j) => {
      const t = str(it && it.t, 60), m = str(it && it.m, 100), src = str(it && it.src, 120);
      if (t.length < 3) errors.push(`${tag}.col[${j}]: thiếu "t".`);
      else if (!src) errors.push(`${tag}.col[${j}]: thiếu "src" (nguồn).`);
      else e.col.push({t, m, src});
    });
    list(x.conf, 4).forEach((it, j) => {
      const w = str(it && it.w, 40), note = str(it && it.note, 160), src = str(it && it.src, 120);
      if (w.length < 2 || note.length < 5) errors.push(`${tag}.conf[${j}]: thiếu "w" hoặc "note".`);
      else if (!src) errors.push(`${tag}.conf[${j}]: thiếu "src" (nguồn).`);
      else e.conf.push({w, note, src});
    });
    if (x.audio !== undefined) {
      if (typeof x.audio === 'string' && AUDIO_RE.test(x.audio)) e.audio = x.audio;
      else errors.push(tag + ': "audio" phải là đường dẫn audio/…(mp3|ogg|m4a|wav).');
    }
    if (e.ex.length || e.col.length || e.conf.length || e.audio) out.words[key] = e;
  });
  list(raw.qs, 3000).forEach((x, i) => {
    const tag = 'qs[' + i + ']';
    const fail = m => errors.push(tag + ': ' + m);
    if (!x || typeof x !== 'object') return fail('không phải đối tượng.');
    const part = Number(x.part);
    if (!Number.isInteger(part) || part < 1 || part > 7) return fail('"part" phải từ 1 đến 7.');
    const o = list(x.o, 4).map(v => str(v, 300));
    if (o.length < 3 || o.some(v => !v)) return fail('"o" cần 3–4 đáp án không rỗng.');
    if (!Number.isInteger(x.a) || x.a < 0 || x.a >= o.length) return fail('"a" phải là chỉ số đáp án đúng.');
    const q = str(x.q, 2000);
    if (!q && part > 2) return fail('thiếu "q".');
    const e = str(x.e, 1500);
    if (!e) return fail('thiếu "e" (giải thích).');
    const src = str(x.src, 120);
    if (!src) return fail('thiếu "src" (nguồn).');
    const ts = str(x.ts, 3000);
    const audioFile = (typeof x.audioFile === 'string' && AUDIO_RE.test(x.audioFile)) ? x.audioFile : '';
    if (x.audioFile !== undefined && !audioFile) return fail('"audioFile" sai định dạng.');
    if (part <= 4 && !ts && !audioFile) return fail('Part 1–4 cần "ts" (lời thoại) hoặc "audioFile".');
    let ctx = null;
    if (Array.isArray(x.ctx)) ctx = x.ctx.slice(0, 5).filter(p => p && typeof p.text === 'string' && p.text.trim())
      .map(p => ({title: str(p.title, 80), text: p.text.trim().slice(0, 4000)}));
    else if (typeof x.ctx === 'string' && x.ctx.trim()) ctx = x.ctx.trim().slice(0, 4000);
    if (part >= 6 && (!ctx || (Array.isArray(ctx) && !ctx.length))) return fail('Part 6–7 cần "ctx" (đoạn văn).');
    if (x.image !== undefined && !(typeof x.image === 'string' && PACK_IMG_RE.test(x.image))) return fail('"image" phải là images/….(png|jpg|webp|gif).');
    const item = {partNo: part, q, o, a: x.a, e, src, ver: x.verified === true, ts, noshuf: part === 1, ctx};
    if (audioFile) item.audioFile = audioFile;
    if (x.image) item.image = x.image;
    if ([1, 2, 3].includes(x.level)) item.level = x.level;
    if (typeof x.qtype === 'string') item.qtype = x.qtype.trim().slice(0, 30);
    if (typeof x.setId === 'string' && /^[A-Za-z0-9_\-]{1,40}$/.test(x.setId)) item.setId = 'K-' + x.setId;
    out.qs.push(item);
  });
  return {pack: out, errors};
}
/*PACK-VALIDATOR-END*/

let PACK_FILE = null;   // gói dùng chung tải từ content/pack.json
let PACK_ERRORS = [];   // lỗi của lần nhập gần nhất
const packWords = () => ({...(PACK_FILE ? PACK_FILE.words : {}), ...((S && S.pack) ? S.pack.words : {})});
const packQs = () => [...(PACK_FILE ? PACK_FILE.qs : []), ...((S && S.pack) ? S.pack.qs : [])];
function playFile(path, fallback){
  if (!AUDIO_RE.test(String(path)) || typeof Audio === 'undefined') { if (fallback) fallback(); return; }
  const a = new Audio(path);
  a.onerror = () => { if (fallback) fallback(); };
  const p = a.play(); if (p && p.catch) p.catch(() => { if (fallback) fallback(); });
}

/* ---- Chia từ vựng thành nhóm 20 từ theo chủ đề. Từ tự thêm nằm trong nhóm "Của tôi" ---- */
function buildVocab(){
  const base = VOCAB_MISSING ? VOCAB_BASE : mergeVocab(VOCAB_BASE, VOCAB_EXTRA);
  const keys = new Set(base.map(v => v.w.toLowerCase()));
  const pw = packWords();
  VOCAB = [...base, ...(S.custom || []).filter(c => !keys.has(c.w.toLowerCase()))].map(v => {
    const e = pw[v.w.toLowerCase()];
    return e ? {...v, exs: e.ex, cols: e.col, confs: e.conf, audio: e.audio} : v;
  });
  const byTopic = {}, order = [];
  VOCAB.forEach(v => {
    const t = v.topic || 'Từ mẫu';
    if (!byTopic[t]) { byTopic[t] = []; order.push(t); }
    byTopic[t].push(v);
  });
  GROUPS = [];
  order.forEach(t => {
    const list = byTopic[t];
    for (let i = 0; i < list.length; i += GROUP_SIZE) {
      GROUPS.push({title: `${t} · Nhóm ${Math.floor(i / GROUP_SIZE) + 1}`, words: list.slice(i, i + GROUP_SIZE)});
    }
  });
  if (vgroup >= GROUPS.length) vgroup = 0;
}
let vgroup = 0;
let vmode = 'group';   // 'group' | 'review' | 'test' | 'add'
let VT = null;         // trạng thái bài kiểm tra nhóm
function groupKnown(g){ return g.words.filter(v => isKnown(S.vocab[v.w])).length; }
function groupLocked(i){
  if (!S.settings.lock || i === 0) return false;
  const prev = GROUPS[i - 1];
  return groupKnown(prev) / prev.words.length < GROUP_UNLOCK;
}
function setGroup(i){
  i = +i;
  if (groupLocked(i)) alert(LOCK_MSG);
  else { vgroup = i; vmode = 'group'; }
  vocabView();
}
function nextGroup(){
  for (let i = vgroup + 1; i < GROUPS.length; i++) {
    if (!groupLocked(i)) { vgroup = i; vmode = 'group'; return vocabView(); }
  }
  alert('Chưa có nhóm nào tiếp theo được mở.');
}
function resetGroup(){ GROUPS[vgroup].words.forEach(v => { delete S.vocab[v.w]; }); save(); vocabView(); }

/* Tách transcript thành các lượt nói để đọc bằng giọng nói */
function transcriptToAudio(part, text){
  if (!text) return null;
  let lines;
  if (part === 1) lines = String(text).split(/(?=\b[A-D]\.\s)/).map(t => ({t: t.trim()}));
  else if (part === 3) lines = String(text).split(/(?=\b[MW]:\s)/).map(t => t.trim())
        .filter(Boolean).map(t => ({t: t.replace(/^[MW]:\s*/, ''), v: /^W:/.test(t)}));
  else lines = [{t: String(text)}];
  lines = lines.filter(x => x.t);
  return lines.length ? lines : null;
}

}

/* Mã khóa ổn định cho từng câu, để lưu thống kê */
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
const qkey = q => q.uid || 'l' + hash([q.q, Array.isArray(q.ctx) ? JSON.stringify(q.ctx) : (q.ctx || ''), (q.o || []).join('|'), q.a].join('|'));

/* ---- Chuẩn hóa câu hỏi: mọi nguồn (file, Supabase, đề thi) đều qua hàm này ----
   Nhãn dạng câu (qtype) theo Part:
   P1: người, vật, địa điểm, hành động, trạng thái
   P2: wh, yes/no, câu hỏi đuôi, đề nghị, khác
   P3–4: chủ đề, chi tiết, suy luận, ý định, đồ họa
   P5: thì, từ loại, giới từ, liên từ, đại từ, so sánh, mệnh đề, rút gọn, đảo ngữ, từ vựng
   P6: điền từ, câu chèn
   P7: ý chính, chi tiết, suy luận, từ vựng, NOT/EXCEPT, tham chiếu, nhiều đoạn
   Nhãn Part 2 được suy ra tự động từ nội dung nếu chưa gắn tay. */
const IMG_RE = /^images\/[A-Za-z0-9_\-\/]+\.(png|jpe?g|webp|gif)$/;
function autoType(partNo, text){
  if (partNo !== 2) return '';
  const t = String(text || '').trim();
  if (/^(where|when|who|what|why|how|which|whose)\b/i.test(t)) return 'wh';
  if (/^(would you like|why don'?t|why not|how about|let'?s|shall)\b/i.test(t)) return 'đề nghị';
  if (/,\s*(isn'?t|aren'?t|don'?t|doesn'?t|didn'?t|won'?t|can'?t|wasn'?t|weren'?t|haven'?t|hasn'?t|is|are|do|did|will|would)\s+(it|he|she|they|we|you|there|that|I)\?$/i.test(t)) return 'câu hỏi đuôi';
  if (/^(do|does|did|is|are|was|were|will|would|can|could|have|has|should)\b/i.test(t)) return 'yes/no';
  return 'khác';
}
function normQ(x){
  const partNo = Number(x.partNo) || Number(String(x.part || '').replace(/\D/g, '')) || 5;
  const ctx = Array.isArray(x.ctx)
    ? x.ctx.filter(p => p && typeof p.text === 'string').slice(0, 5)
        .map(p => ({title: String(p.title || '').slice(0, 80), text: String(p.text)}))
    : (x.ctx ? String(x.ctx) : null);
  const probe = x.ts || (x.audio && x.audio[0] && x.audio[0].t) || x.q;
  return {...x, partNo, part: 'Part ' + partNo, ctx,
          image: (typeof x.image === 'string' && IMG_RE.test(x.image)) ? x.image : null,
          qtype: String(x.qtype || autoType(partNo, probe) || '').slice(0, 30),
          level: [1, 2, 3].includes(x.level) ? x.level : 2};
}

/* Bộ câu: các câu cùng đoạn văn hoặc cùng bài nghe */
function setKey(q){
  if (q.setId) return q.setId;
  if (q.ctx) return 'c' + hash(Array.isArray(q.ctx) ? JSON.stringify(q.ctx) : q.ctx);
  if (q.ts) return 't' + hash(q.ts);
  return '';
}
const groupKey = q => setKey(q) || qkey(q);
function groupSets(qs){
  const m = new Map();
  qs.forEach(q => { const k = groupKey(q); if (!m.has(k)) m.set(k, []); m.get(k).push(q); });
  return [...m.values()];
}
/* Xáo thứ tự các bộ nhưng giữ nguyên thứ tự câu trong mỗi bộ */
function orderSets(qs){ return shuffle(groupSets(qs)).flat(); }

/* Toàn bộ câu hỏi của một Part: có sẵn trong file + từ Supabase */
function poolFor(n){
  const label = 'Part ' + n;
  const local = n === 5 ? GRAMMAR : n <= 4 ? LISTEN_QS.filter(q => q.part === label) : READING_QS.filter(q => q.part === label);
  const pk = packQs().filter(q => q.partNo === n).map(q => ({...q, audio: q.audio || transcriptToAudio(n, q.ts)}));
  return [...local, ...DB_QS.filter(q => q.partNo === n), ...pk].map(q => normQ({...q, partNo: n}));
}

/* Logic ôn tập: câu chưa làm và câu hay sai lên trước; câu đã đúng liên tiếp xuống cuối */
function prioritise(qs){
  const score = q => {
    const s = S.qstats[qkey(q)];
    if (!s) return 2 + Math.random();
    if (s.streak >= 2) return Math.random() * 0.5;
    return 1 + s.wrong * 2 + Math.random();
  };
  return qs.map(q => ({q, w: score(q)})).sort((a, b) => b.w - a.w).map(x => x.q);
}

/* Ghi kết quả một câu và cập nhật lịch lặp của câu đó (dùng cùng thuật toán với từ vựng) */
function recordAnswer(q, ok){
  const k = q.key || qkey(q);
  const st = S.qstats[k] || (S.qstats[k] = {seen:0, wrong:0, streak:0, p:q.partNo || 0, t:'', box:0, due:0});
  st.seen++;
  if (ok) st.streak++; else { st.wrong++; st.streak = 0; }
  const g = gradeEntry(st, ok ? 'good' : 'again', Date.now());
  st.box = g.box; st.due = g.due;
  if (q.qtype) st.t = q.qtype;
  save();
}

function partAccuracy(n){
  let seen = 0, wrong = 0;
  Object.values(S.qstats).forEach(s => { if (s.p === n) { seen += s.seen; wrong += s.wrong; } });
  return seen ? Math.round((seen - wrong) / seen * 100) + '% (' + seen + ' lượt)' : 'chưa làm';
}

function practicePart(id){
  const p = PARTS.find(x => x.id === id);
  const n = Number(id.slice(1));
  const pool = poolFor(n);
  if (!pool.length) return alert('Chưa có câu hỏi cho ' + p.label + '.');
  const session = prioritise(pool).slice(0, 20);
  const statKey = n === 5 ? 'quiz' : n <= 4 ? 'lq' : 'reading';
  startQuiz(p.label, session, statKey, 'parts', false, 0, () => practicePart(id));
}

/* Ôn câu sai theo lịch: chỉ lấy câu đã sai và đã đến hạn, quá hạn lâu nhất lên trước */
function practiceWrong(){
  const now = Date.now();

                 .sort((a, b) => (st(a).due || 0) - (st(b).due || 0)).slice(0, 20);
  if (!due.length) return alert('Chưa có câu nào đến hạn ôn lại.');
  startQuiz('Ôn câu đã sai', due, null, 'parts', false, 0, practiceWrong);
}

/* Chỉ giữ lại dữ liệu đúng kiểu, vì dữ liệu localStorage hoặc file nhập vào không đáng tin tuyệt đối */
function sanitize(raw){
  const out = clone(DEFAULT);
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  const num = v => (Number.isFinite(v) && v >= 0) ? Math.min(v, 1e7) : 0;
  const pair = p => ({correct: num(p && p.correct), total: num(p && p.total)});
  out.target = (Number.isFinite(raw.target) && raw.target >= 10 && raw.target < 990 && raw.target !== 850) ? raw.target : 990;   // 850 là mục tiêu cũ, nay chuyển thành 990
  out.quiz = pair(raw.quiz); out.reading = pair(raw.reading); out.lq = pair(raw.lq);
  out.listen = {done: num(raw.listen && raw.listen.done), score: num(raw.listen && raw.listen.score)};
  const ts = v => (Number.isFinite(v) && v >= 0 && v < 4e12) ? v : 0;   // mốc thời gian (ms)
  if (raw.vocab && typeof raw.vocab === 'object' && !Array.isArray(raw.vocab))
    out.vocab = Object.fromEntries(Object.entries(raw.vocab).slice(0, 5000)
      .filter(([k, v]) => k.length <= 80 && v && typeof v === 'object')
      .map(([k, v]) => {
        if (typeof v.box !== 'number')   // dữ liệu cũ chỉ có cờ known
          return [k, {box: v.known === true ? KNOWN_BOX : 0, due: 0, seen: num(v.seen), wrong: 0}];
        return [k, {box: Math.min(5, num(v.box)), due: ts(v.due), seen: num(v.seen), wrong: num(v.wrong)}];
      }));
  if (Array.isArray(raw.custom))
    out.custom = raw.custom.slice(0, 500)
      .filter(c => c && typeof c.w === 'string' && typeof c.m === 'string' && /^[A-Za-z][A-Za-z' -]{0,59}$/.test(c.w) && c.m.trim())
      .map(c => ({w: c.w.trim(), m: c.m.trim().slice(0, 200), ipa: String(c.ipa || '').slice(0, 80),
                  ex: String(c.ex || '').slice(0, 300), topic: 'Của tôi', pos: ''}));
  out.settings = {accent: raw.settings && raw.settings.accent === 'UK' ? 'UK' : 'US',
                  lock: !(raw.settings && raw.settings.lock === false),
                  realListen: !(raw.settings && raw.settings.realListen === false),
                  scroll: !(raw.settings && raw.settings.scroll === false)};
  if (raw.daily && typeof raw.daily.d === 'string') out.daily = {d: raw.daily.d.slice(0, 10), n: num(raw.daily.n)};
  if (raw.streak && typeof raw.streak.last === 'string') out.streak = {last: raw.streak.last.slice(0, 10), count: num(raw.streak.count)};
  if (Array.isArray(raw.history))
    out.history = raw.history.slice(0, 30).filter(h => h && typeof h === 'object')
      .map(h => ({date: String(h.date || '').slice(0, 40), name: String(h.name || '').slice(0, 80),
                  score: String(h.score || '').slice(0, 20), pct: num(h.pct)}));
  if (Array.isArray(raw.mocks))
    out.mocks = raw.mocks.slice(0, 20).filter(m => m && typeof m === 'object').map(m => ({
      date: String(m.date || '').slice(0, 40), L: num(m.L), LT: num(m.LT), R: num(m.R), RT: num(m.RT),
      Ls: num(m.Ls), Rs: num(m.Rs), tot: num(m.tot)}));
  if (raw.qstats && typeof raw.qstats === 'object' && !Array.isArray(raw.qstats))
    out.qstats = Object.fromEntries(Object.entries(raw.qstats).slice(0, 5000)
      .filter(([k, v]) => k.length <= 40 && v && typeof v === 'object')
      .map(([k, v]) => [k, {seen: num(v.seen), wrong: num(v.wrong), streak: num(v.streak), p: num(v.p),
                            box: Math.min(5, num(v.box)), due: (Number.isFinite(v.due) && v.due >= 0 && v.due < 4e12) ? v.due : 0,
                            t: typeof v.t === 'string' ? v.t.slice(0, 30) : ''}]));
  if (raw.pack && typeof raw.pack === 'object' && !Array.isArray(raw.pack)) {
    const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
    const words = isObj(raw.pack.words) ? Object.entries(raw.pack.words).filter(([, e]) => isObj(e)).map(([w, e]) => ({w, ...e})) : [];
    const qs = Array.isArray(raw.pack.qs) ? raw.pack.qs.filter(isObj).map(q => ({...q, part: q.partNo, verified: q.ver, setId: q.setId ? String(q.setId).replace(/^K-/, '') : undefined})) : [];
    const p = validatePack({version: 1, name: raw.pack.name, words, qs}).pack;
    out.pack = (Object.keys(p.words).length || p.qs.length) ? p : null;
  }
  return out;
}

/* =========================================================
   TỪ VỰNG (flashcard)
   ========================================================= */
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
const todayStr = () => new Date().toLocaleDateString('sv-SE');
function yesterdayStr(){ return new Date(Date.now() - DAY_MS).toLocaleDateString('sv-SE'); }
function bumpDaily(){
  const d = todayStr();
  S.daily = (S.daily && S.daily.d === d) ? {d, n: S.daily.n + 1} : {d, n: 1};
  if (S.streak.last === d) return;
  S.streak = {last: d, count: S.streak.last === yesterdayStr() ? S.streak.count + 1 : 1};
}
/* Chuỗi học còn hiệu lực nếu học hôm nay hoặc hôm qua */
function currentStreak(){
  const last = S.streak.last;
  return (last === todayStr() || last === yesterdayStr()) ? S.streak.count : 0;
}
function topicStats(topic){
  const words = VOCAB.filter(v => (v.topic || 'Từ mẫu') === topic);
  return {known: words.filter(v => isKnown(S.vocab[v.w])).length, total: words.length};
}
function duePool(){
  const now = Date.now();
  if (vmode === 'review') return VOCAB.filter(v => S.vocab[v.w] && isDue(S.vocab[v.w], now));
  return GROUPS[vgroup].words.filter(v => isDue(S.vocab[v.w], now));
}
function reviewCount(){
  const now = Date.now();
  return VOCAB.filter(v => S.vocab[v.w] && isDue(S.vocab[v.w], now)).length;
}
function nextDueText(words){
  const now = Date.now();
  const times = words.map(v => S.vocab[v.w]).filter(e => e && e.due > now).map(e => e.due);
  if (!times.length) return '';
  return new Date(Math.min(...times)).toLocaleString('vi-VN', {dateStyle: 'short', timeStyle: 'short'});
}
function setVmode(m){ vmode = m; vocabView(); }
function toggleLock(on){ S.settings.lock = !!on; save(); vocabView(); }
function setAccent(a){ S.settings.accent = a === 'UK' ? 'UK' : 'US'; save(); vocabView(); }
function accentLang(){ return S.settings.accent === 'UK' ? 'en-GB' : 'en-US'; }
function speakText(text, rate){ say([{t: text, lang: accentLang()}], rate); }

function vocabView(){
  if (vmode === 'add') return addWordView();
  if (vmode === 'test') return vtestView();
  const group = GROUPS[vgroup];
  const pool = duePool();
  const selector = `<select onchange="setGroup(this.value)" style="padding:8px;border-radius:8px;font-size:15px;width:100%;margin-bottom:10px">${GROUPS.map((g, i) => `<option value="${i}" ${i === vgroup ? 'selected' : ''} ${groupLocked(i) ? 'disabled' : ''}>${groupLocked(i) ? '🔒 ' : ''}${esc(g.title)} (${groupKnown(g)}/${g.words.length})</option>`).join('')}</select>`;
  const topic = group.words[0].topic || 'Từ mẫu';
  const tp = topicStats(topic);
  const status = `<div style="margin-bottom:10px"><div class="muted" style="font-size:14px;margin-bottom:4px">Chủ đề "${esc(topic)}": ${tp.known}/${tp.total} từ đã thuộc · Chuỗi học: ${currentStreak()} ngày</div><div class="bar"><div style="width:${tp.total ? tp.known / tp.total * 100 : 0}%"></div></div></div>`;
  const controls = `
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px">
      ${vmode === 'review'
        ? `<button class="btn alt" onclick="setVmode('group')">← Quay về nhóm</button>`
        : `<button class="btn alt" onclick="setVmode('review')">Ôn từ cần ôn (${reviewCount()})</button>`}
      <button class="btn alt" onclick="startVTest()">Kiểm tra nhóm</button>
      <button class="btn alt" onclick="setVmode('add')">+ Thêm từ</button>
      <select onchange="setAccent(this.value)" style="padding:8px;border-radius:8px">
        <option value="US" ${S.settings.accent !== 'UK' ? 'selected' : ''}>Giọng Mỹ</option>
        <option value="UK" ${S.settings.accent === 'UK' ? 'selected' : ''}>Giọng Anh</option>
      </select>
      <label class="muted"><input type="checkbox" ${S.settings.lock ? 'checked' : ''} onchange="toggleLock(this.checked)"> Khóa nhóm tiếp theo</label>
    </div>
    ${status}`;
  const todayN = (S.daily && S.daily.d === todayStr()) ? S.daily.n : 0;
  if (!pool.length) {
    const words = vmode === 'review' ? VOCAB : group.words;
    const next = nextDueText(words);
    const done = vmode !== 'review' && groupKnown(group) === group.words.length;
    const msg = vmode === 'review' ? 'Hiện không có từ nào cần ôn.'
              : done ? '🎉 Bạn đã thuộc hết nhóm này.'
              : 'Đã hết thẻ đến hạn trong nhóm này.';
    const actions = vmode === 'review' ? '' :
      '<button class="btn" onclick="nextGroup()">Sang nhóm tiếp theo</button> <button class="btn alt" onclick="resetGroup()">Làm lại nhóm này</button>';
    app.innerHTML = `<div class="card">${selector}${controls}${msg}${next ? `<br><span class="muted">Thẻ tiếp theo đến hạn: ${esc(next)}</span>` : ''}<br><br>${actions}</div>`;
    return;
  }
  vcur = pool[Math.floor(Math.random() * pool.length)];
  const tags = [vcur.pos, vcur.topic].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join(' ');
  app.innerHTML = `
    <div class="card">
      ${selector}${controls}
      <p class="muted">Còn ${pool.length} thẻ đến hạn · Hôm nay đã ôn ${todayN} thẻ. Phím tắt: Space lật thẻ, 1/2/3 để chấm điểm.</p>
      <div class="flash" onclick="flip()">
        <div class="word">${esc(vcur.w)}</div>
        <div style="font-size:26px;font-weight:700;color:var(--main);margin-top:6px">${esc(respell(vcur.ipa))}</div>
        <div style="font-size:14px;color:var(--muted)">${esc(vcur.ipa || '')}</div>
        <div style="margin-top:6px">${tags}</div>
        <div style="margin-top:8px">
          <button class="btn alt" onclick="event.stopPropagation();speakText(vcur.w,1)">🔊 Phát âm</button>
          <button class="btn alt" onclick="event.stopPropagation();speakText(vcur.w,0.6)">🐢 Chậm</button>
        </div>
        <div id="back" hidden>
          <div style="font-size:20px;margin-top:10px">${esc(vcur.m)}</div>
          ${wordExtraHTML(vcur)}
        </div>
      </div>
      <div style="margin-top:14px;text-align:center">
        <button class="btn alt" id="g-flip" onclick="flip()">Xem nghĩa</button>
        <span id="g-btns" hidden>
          <button class="btn alt" onclick="grade('again')">Chưa biết (1)</button>
          <button class="btn alt" onclick="grade('hard')">Khó (2)</button>
          <button class="btn" onclick="grade('good')">Biết (3)</button>
        </span>
      </div>
    </div>`;
}
function wordExtraHTML(v){
  const ex = (v.exs && v.exs.length)
    ? v.exs.map(x => `<div class="exp">${esc(x.t)} <span class="muted">· ${esc(x.src)}</span></div>`).join('')
    : `<div class="exp">${v.ex ? esc(v.ex) : '<span class="muted">Chưa có câu ví dụ cho từ này.</span>'}</div>`;
  const col = (v.cols && v.cols.length)
    ? `<div class="muted">Cụm từ đi kèm: ${v.cols.map(c => esc(c.t) + (c.m ? ' (' + esc(c.m) + ')' : '')).join(' · ')}</div>`
    : (v.col ? `<div class="muted">Cụm từ đi kèm: ${esc(v.col)}</div>` : '');
  const conf = (v.confs && v.confs.length)
    ? `<div class="muted">Dễ nhầm: ${v.confs.map(c => '<b>' + esc(c.w) + '</b> – ' + esc(c.note)).join('; ')}</div>`
    : (v.conf ? `<div class="muted">Dễ nhầm với: ${esc(v.conf)}</div>` : '');
  const au = v.audio ? `<div style="margin-top:6px"><button class="btn alt" onclick="event.stopPropagation();playFile(vcur.audio, () => speakText(vcur.w, 1))">🎧 Giọng thật</button></div>` : '';
  return ex + col + conf + au;
}
function flip(){
  const b = document.getElementById('back');
  if (!b) return;
  b.hidden = !b.hidden;
  const shown = !b.hidden;
  document.getElementById('g-btns').hidden = !shown;
  document.getElementById('g-flip').style.display = shown ? 'none' : '';
}
function grade(g){
  if (!vcur) return;
  S.vocab[vcur.w] = gradeEntry(S.vocab[vcur.w], g, Date.now());
  bumpDaily(); save(); vocabView();
}

function addCustom(){
  const err = document.getElementById('nerr');
  const w = document.getElementById('nw').value.trim().replace(/\s+/g, ' ');
  const m = document.getElementById('nm').value.trim();
  const ipa = document.getElementById('ni').value.trim();

  if (!/^[A-Za-z][A-Za-z' -]{0,59}$/.test(w)) { err.textContent = 'Từ chỉ gồm chữ cái tiếng Anh, khoảng trắng, dấu nháy hoặc gạch ngang.'; return; }
  if (!m) { err.textContent = 'Cần nhập nghĩa tiếng Việt.'; return; }
  if (VOCAB.some(v => v.w.toLowerCase() === w.toLowerCase())) { err.textContent = 'Từ này đã có trong bộ từ.'; return; }
  if (S.custom.length >= 500) { err.textContent = 'Đã đạt giới hạn 500 từ tự thêm.'; return; }
  S.custom.push({w, m: m.slice(0, 200), ipa: ipa.slice(0, 80), ex: ex.slice(0, 300), topic: 'Của tôi', pos: ''});
  save(); buildVocab();
  vgroup = GROUPS.findIndex(g => g.words.some(v => v.w === w));

/* ---- Kiểm tra nhóm: 4 dạng câu (Việt→Anh, Anh→Việt, nghe chọn từ, điền từ vào câu) ---- */
function makeTQ(v){
  const kinds = ['vi2en', 'en2vi', 'listen'];
  if (v.ex && new RegExp(escRe(v.w), 'i').test(v.ex)) kinds.push('fill');
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  const key = kind === 'en2vi' ? 'm' : 'w';
  const correct = v[key];
  const distract = [...new Set(shuffle(VOCAB.filter(x => x.w !== v.w)).map(x => x[key]))]
    .filter(t => t !== correct).slice(0, 3);
  const opts = shuffle([correct, ...distract]);
  const prompt = kind === 'vi2en' ? v.m
    : kind === 'en2vi' ? v.w
    : kind === 'fill' ? v.ex.replace(new RegExp(escRe(v.w), 'i'), '_____') : '';
  return {kind, v, prompt, opts, a: opts.indexOf(correct)};
}
function startVTest(){
  if (groupLocked(vgroup)) return alert(LOCK_MSG);
  const words = shuffle(GROUPS[vgroup].words).slice(0, 20);
  if (words.length < 4) return alert('Nhóm này cần ít nhất 4 từ để kiểm tra.');
  VT = {words, i: 0, c: 0, wrong: [], answered: false, picked: -1, ok: false, q: makeTQ(words[0])};
  vmode = 'test';
  vtestView();
}
function vtestView(){
  const q = VT.q, n = VT.words.length;
  const prompt = q.kind === 'listen'
    ? `<button class="btn alt" onclick="speakText(VT.q.v.w,1)">🔊 Nghe lại</button>`
    : `<div style="font-size:20px;margin:10px 0">${esc(q.prompt)}</div>`;
  const opts = q.opts.map((o, k) => {
    let cls = 'opt';
    if (VT.answered && k === q.a) cls += ' right';
    else if (VT.answered && k === VT.picked) cls += ' wrong';
    return `<button class="${cls}" onclick="pickT(${k})" ${VT.answered ? 'disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  const fb = VT.answered
    ? `<div class="exp"><b>${VT.ok ? 'Chính xác!' : 'Chưa đúng.'}</b> ${esc(q.v.w)}: ${esc(q.v.m)}${q.v.ex ? `<br>${esc(q.v.ex)}` : ''}</div>
       <button class="btn" onclick="nextT()">${VT.i + 1 < n ? 'Câu tiếp theo' : 'Xem kết quả'}</button>`
    : '';
  app.innerHTML = `<div class="card">
    <b>Kiểm tra nhóm: ${esc(GROUPS[vgroup].title)}</b>
    <p class="muted">Câu ${VT.i + 1}/${n} · Đúng ${VT.c}</p>
    ${prompt}${opts}${fb}
    <p><button class="btn alt" onclick="setVmode('group')">Thoát</button></p></div>`;
  if (q.kind === 'listen' && !VT.answered) speakText(q.v.w, 1);
}
function pickT(k){
  if (!VT || VT.answered) return;
  VT.answered = true; VT.picked = k; VT.ok = k === VT.q.a;
  if (VT.ok) VT.c++; else VT.wrong.push(VT.q.v);
  S.vocab[VT.q.v.w] = gradeEntry(S.vocab[VT.q.v.w], VT.ok ? 'good' : 'again', Date.now());
  bumpDaily(); save(); vtestView();
}
function nextT(){
  VT.i++; VT.answered = false;
  if (VT.i >= VT.words.length) return finishT();
  VT.q = makeTQ(VT.words[VT.i]);
  vtestView();
}
function finishT(){
  const n = VT.words.length, pct = Math.round(VT.c / n * 100);
  const msg = pct >= 85 ? 'Rất tốt, hãy giữ nhịp độ này.'
            : pct >= 60 ? 'Khá ổn. Hãy xem lại các từ sai.'
            : 'Cần ôn thêm. Hãy đọc lại nghĩa các từ sai.';
  const wrong = VT.wrong.length
    ? `<p>Từ sai (${VT.wrong.length}): ${VT.wrong.map(v => esc(v.w)).join(', ')}</p>`
    : '<p class="muted">Bạn không làm sai từ nào.</p>';
  app.innerHTML = `<div class="card"><b>Kết quả: ${VT.c}/${n} (${pct}%)</b><p>${msg}</p>${wrong}
    <button class="btn" onclick="setVmode('review')">Ôn từ sai ngay</button>
    <button class="btn alt" onclick="setVmode('group')">Quay về nhóm</button></div>`;
}

/* Phím tắt: Space lật thẻ, 1/2/3 chấm điểm, 1–4 chọn đáp án khi kiểm tra */
document.addEventListener('keydown', e => {
  if (currentRoute !== 'vocab' || ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (vmode === 'test' && VT) {
    if (!VT.answered && /^[1-4]$/.test(e.key)) return pickT(+e.key - 1);
    if (VT.answered && e.key === 'Enter') return nextT();
    return;
  }
  if (vmode !== 'group' && vmode !== 'review') return;
  if (e.key === ' ' && vcur) { e.preventDefault(); flip(); }
  else if (/^[123]$/.test(e.key) && vcur) {
    const b = document.getElementById('back');
    if (b && !b.hidden) grade(['again', 'hard', 'good'][+e.key - 1]);
  }
});

/* =========================================================
   ÂM THANH (đọc văn bản bằng giọng nói của trình duyệt)
   ========================================================= */
function pickVoice(lang){
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === lang) || vs.find(v => v.lang.startsWith(lang.slice(0, 2))) || null;
}
function say(lines, rate){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  let i = 0;
  const next = () => {
    if (i >= lines.length) return;
    const L = lines[i++];
    const u = new SpeechSynthesisUtterance(L.t);
    u.lang = L.lang || 'en-US';
    const voice = pickVoice(u.lang);
    if (voice) u.voice = voice;
    u.rate = rate;
    u.pitch = L.v ? 1.3 : 0.9;   // hai người nói khác giọng
    u.onend = next;
    speechSynthesis.speak(u);
  };
  next();
}

/* =========================================================
   ENGINE CÂU HỎI TRẮC NGHIỆM (dùng chung)
   ========================================================= */
function stopTimer(){ if (tid) clearInterval(tid); tid = null; }

/* Tùy chọn: keepSets (giữ các câu cùng bộ đi liền nhau), keepOrder (giữ nguyên thứ tự),
   strict (chế độ thi thật cho nghe), allowBack (được quay lại câu trước), onDone (chuyển sang phần kế tiếp) */
function startQuiz(name, qs, statKey, back, mock, minutes, again, o = {}){
  stopTimer();
  const list = o.keepOrder ? qs : o.keepSets ? orderSets(qs) : shuffle(qs);
  Q = {name, qs: list.map(x => prep(normQ(x))), i:0, c:0, wrong:[], statKey, back, mock, answered:false,
       end: Date.now() + minutes*60000, again, strict: !!o.strict, allowBack: !!o.allowBack,
       onDone: o.onDone || null, sel: {}, played: {}, done: {},
       scroll: o.scroll !== undefined ? !!o.scroll : (S.settings.scroll !== false && !o.strict)};
  if (mock) tid = setInterval(() => { if (Q && Q.mock) updateTimer(); }, 1000);
  if (Q.scroll) drawAll(); else drawQ();
}

function updateTimer(){
  const el = document.getElementById('timer');
  const left = Math.max(0, Q.end - Date.now());
  if (el) el.textContent = `${Math.floor(left/60000)}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;
  if (left <= 0) { Q.i = Q.qs.length; finishQ(); }
}

/* Part 1–2 ở chế độ thi thật: đáp án chỉ có tiếng, không in chữ */
function hidesOptions(q){ return !!Q.strict && (q.partNo === 1 || q.partNo === 2); }
/* Part 2 ở chế độ thi thật: đọc cả các đáp án A, B, C trong bài nghe */
function listenAudioFor(q){
  if (!q.audio) return null;
  if (Q.strict && q.partNo === 2 && q.o.length) return [...q.audio, ...q.o.map((o, k) => ({t: 'ABCD'[k] + '. ' + o}))];
  return q.audio;
}
function playQ(){ playAt(Q ? Q.i : 0); }
function playAt(i){
  const q = Q && Q.qs[i]; if (!q) return;
  const speak = () => { const lines = listenAudioFor(q); if (lines) say(lines, 0.9); };
  if (q.audioFile) playFile(q.audioFile, speak); else speak();
}

/* Đoạn văn: một đoạn hoặc nhiều đoạn có tiêu đề; câu đầu của bộ mở sẵn, các câu sau thu gọn */
function passageHTML(ctx, open){
  const body = Array.isArray(ctx)
    ? ctx.map((p, i) => `<div style="margin-bottom:10px"><b>${esc(p.title || 'Đoạn ' + (i + 1))}</b><div class="exp passage">${esc(p.text)}</div></div>`).join('')
    : `<div class="exp passage">${esc(ctx)}</div>`;
  return `<details ${open ? 'open' : ''} style="margin-bottom:10px"><summary>Đoạn văn</summary>${body}</details>`;
}

function drawQ(){
  if (Q.i >= Q.qs.length) return finishQ();
  const q = Q.qs[Q.i], total = Q.qs.length;
  const prev = Q.i > 0 ? Q.qs[Q.i - 1] : null;
  const sameSet = !!prev && groupKey(prev) === groupKey(q);
  const hide = hidesOptions(q);
  const sel = Q.mock ? Q.sel[Q.i] : undefined;
  const showPassage = q.ctx && !(q.partNo === 1 && q.image);
  const opts = q.o.map((t, k) => {
    const label = hide ? 'ABCD'[k] : 'ABCD'[k] + '. ' + t;
    return `<button class="opt${sel === k ? ' sel' : ''}" onclick="pick(${k})">${esc(label)}</button>`;
  }).join('');
  const nav = Q.mock
    ? `${Q.allowBack && Q.i > 0 ? '<button class="btn alt" onclick="prevQ()">← Câu trước</button> ' : ''}<button class="btn" onclick="nextQ()">${Q.i + 1 < total ? 'Câu tiếp theo' : 'Xem kết quả'}</button> <button class="btn alt" onclick="submitQ()">Nộp bài</button>`
    : '<div id="nxt"></div>';
  app.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <span class="muted">${esc(Q.name)}${q.part && q.part !== Q.name ? ' · ' + esc(q.part) : ''} — Câu ${Q.i+1}/${total}</span>
        ${Q.mock ? '<span class="timer" id="timer"></span>' : (Q.strict ? '' : '<button class="btn alt" style="margin:0" onclick="toggleScroll()">Dạng cuộn</button>')}
      </div>
      <div class="bar" style="margin:8px 0 14px"><div style="width:${Q.i/total*100}%"></div></div>
      ${showPassage ? passageHTML(q.ctx, !sameSet) : ''}
      ${q.image ? `<img src="${esc(q.image)}" alt="" style="max-width:100%;border-radius:10px;margin-bottom:10px">` : ''}
      ${q.audio && !Q.strict ? `<button class="btn alt" onclick="playQ()">🔊 Nghe lại</button>` : ''}
      <div style="font-size:17px;line-height:1.6;white-space:pre-line;margin-top:6px">${esc(q.q)}</div>
      <div>${opts}</div>
      <div id="exp"></div>${nav}
    </div>`;
  if (Q.mock) updateTimer();
  if (q.audio && !Q.played[Q.i]) {
    Q.played[Q.i] = true;
    if (!(Q.strict && sameSet)) playQ();   // bài nghe dùng chung chỉ phát một lần
  }
}

/* Dạng cuộn: mọi câu của bài nằm trên một trang, trả lời tại chỗ, không cần bấm "Câu tiếp theo" */
function drawAll(){
  const total = Q.qs.length;
  const runs = [];
  Q.qs.forEach((q, i) => {
    const last = runs[runs.length - 1];
    if (last && groupKey(Q.qs[last[0]]) === groupKey(q)) last.push(i); else runs.push([i]);
  });
  const cards = runs.map(run => {
    const first = Q.qs[run[0]];
    const passage = first.ctx && !(first.partNo === 1 && first.image) ? passageHTML(first.ctx, true) : '';
    const items = run.map((i, j) => {
      const q = Q.qs[i];
      const opts = q.o.map((t, k) => `<button class="opt${Q.mock && Q.sel[i] === k ? ' sel' : ''}" onclick="pickAt(${i},${k})">${esc('ABCD'[k] + '. ' + t)}</button>`).join('');
      return `<div class="qitem" id="qc${i}">
        <div class="muted qhead">${esc(q.part)} · Câu ${i + 1}/${total}</div>
        ${q.image ? `<img src="${esc(q.image)}" alt="" style="max-width:100%;border-radius:10px;margin-bottom:10px">` : ''}
        ${q.audio && j === 0 ? `<button class="btn alt" onclick="playAt(${i})">🔊 Nghe${run.length > 1 ? ' (dùng cho câu ' + (run[0] + 1) + '–' + (run[run.length - 1] + 1) + ')' : ''}</button>` : ''}
        <div class="qtext">${esc(q.q)}</div>
        <div id="opts${i}">${opts}</div>
        <div id="exp${i}"></div></div>`;
    }).join('');
    return `<div class="card">${passage}${items}</div>`;
  }).join('');
  app.innerHTML = `
    <div class="qbar">
      <div style="flex:1;min-width:0"><div class="muted" id="qprog" style="font-size:14px;margin-bottom:4px"></div><div class="bar"><div id="qfill" style="width:0"></div></div></div>
      ${Q.mock ? '<span class="timer" id="timer"></span>' : '<button class="btn alt" style="margin:0" onclick="toggleScroll()">Từng câu</button>'}
    </div>
    <h2 style="margin:4px 2px 12px">${esc(Q.name)}</h2>
    ${cards}
    <div class="card">${Q.mock ? '<button class="btn" onclick="submitScroll()">Nộp bài</button>' : '<button class="btn" onclick="finishScroll()">Xem kết quả</button>'}</div>`;
  scrollProgress();
  if (Q.mock) updateTimer();
}
function scrollProgress(){
  const n = Object.keys(Q.mock ? Q.sel : Q.done).length, total = Q.qs.length;
  const p = document.getElementById('qprog'), f = document.getElementById('qfill');
  if (p) p.textContent = Q.mock ? `Đã chọn ${n}/${total} câu` : `Đã làm ${n}/${total} · đúng ${Q.c}`;
  if (f) f.style.width = (total ? n / total * 100 : 0) + '%';
}
function pickAt(i, k){
  if (!Q) return;
  if (Q.mock) {   // thi thử: chỉ ghi lựa chọn, đổi được, chấm khi nộp
    Q.sel[i] = k;
    document.querySelectorAll('#opts' + i + ' .opt').forEach((b, j) => b.classList.toggle('sel', j === k));
    return scrollProgress();
  }
  if (Q.done[i] !== undefined) return;
  const q = Q.qs[i], ok = k === q.a;
  Q.done[i] = k;
  if (ok) Q.c++; else Q.wrong.push(q);
  recordAnswer(q, ok);
  const btns = document.querySelectorAll('#opts' + i + ' .opt');
  if (btns[q.a]) btns[q.a].classList.add('right');
  if (!ok && btns[k]) btns[k].classList.add('wrong');
  btns.forEach(b => b.disabled = true);
  const ts = q.ts ? `<br><br><i>Nội dung bài nghe:</i> ${esc(q.ts)}` : '';
  const srcLine = q.src ? `<br><span class="muted">Nguồn: ${esc(q.src)}${q.ver ? '' : ' · chưa duyệt'}</span>` : '';
  const ex = document.getElementById('exp' + i);
  if (ex) ex.innerHTML = `<div class="exp"><b>${ok ? 'Chính xác!' : 'Chưa đúng.'}</b> ${esc(q.e)}${ts}${srcLine}</div>`;
  scrollProgress();
}
function finishScroll(){
  const left = Q.qs.length - Object.keys(Q.done).length;
  if (left && !confirm(`Còn ${left} câu chưa làm. Xem kết quả với các câu đã làm?`)) return;
  Q.qs = Q.qs.filter((q, i) => Q.done[i] !== undefined);
  if (!Q.qs.length) return route(Q.back);
  finishQ();
}
function submitScroll(){
  const left = Q.qs.length - Object.keys(Q.sel).length;
  if (confirm(left ? `Còn ${left} câu chưa chọn. Nộp bài?` : 'Nộp bài và kết thúc phần này?')) finishQ();
}
function toggleScroll(){
  S.settings.scroll = !S.settings.scroll; save();
  if (Q && !Q.mock) { if (Q.again) Q.again(); else route(Q.back); }
}

function pick(k){
  if (Q.mock) { Q.sel[Q.i] = k; return drawQ(); }   // thi thử: không hiện đáp án khi đang làm
  if (Q.answered) return;
  Q.answered = true;
  const q = Q.qs[Q.i], ok = k === q.a;
  if (ok) Q.c++; else Q.wrong.push(q);
  recordAnswer(q, ok);
  const btns = document.querySelectorAll('.opt');
  if (hidesOptions(q)) btns.forEach((b, i) => { b.textContent = 'ABCD'[i] + '. ' + q.o[i]; });
  btns[q.a].classList.add('right');
  if (!ok) btns[k].classList.add('wrong');
  btns.forEach(b => b.disabled = true);
  const ts = q.ts ? `<br><br><i>Nội dung bài nghe:</i> ${esc(q.ts)}` : '';
  const srcLine = q.src ? `<br><span class="muted">Nguồn: ${esc(q.src)}${q.ver ? '' : ' · chưa duyệt'}</span>` : '';
  document.getElementById('exp').innerHTML = `<div class="exp"><b>${ok ? 'Chính xác!' : 'Chưa đúng.'}</b> ${esc(q.e)}${ts}${srcLine}</div>`;
  document.getElementById('nxt').innerHTML = `<button class="btn" onclick="nextQ()">${Q.i+1 < Q.qs.length ? 'Câu tiếp theo' : 'Xem kết quả'}</button>`;
}

function nextQ(){ Q.i++; Q.answered = false; drawQ(); }
function prevQ(){ if (Q.i > 0) { Q.i--; drawQ(); } }
function submitQ(){ if (confirm('Nộp bài và kết thúc phần này?')) finishQ(); }

/* Kết thúc bài: thi thử chấm điểm lúc này (câu chưa làm tính là sai nhưng không ghi vào lịch lặp) */
let NEXT_STAGE = () => {};
function finishQ(){
  stopTimer();
  if (Q.mock) {
    Q.c = 0; Q.wrong = [];
    Q.qs.forEach((q, i) => {
      const answered = Q.sel[i] !== undefined;
      const ok = answered && Q.sel[i] === q.a;
      if (ok) Q.c++; else Q.wrong.push(q);
      if (answered) recordAnswer(q, ok);
    });
  }
  const total = Q.qs.length, pct = total ? Math.round(Q.c/total*100) : 0;
  if (Q.statKey) { S[Q.statKey].correct += Q.c; S[Q.statKey].total += total; }
  S.history.unshift({date: new Date().toLocaleString('vi-VN'), name: Q.name, score: `${Q.c}/${total}`, pct});
  S.history = S.history.slice(0,30);
  save();
  if (Q.onDone) {
    const cb = Q.onDone, payload = {c: Q.c, total, wrong: Q.wrong};
    NEXT_STAGE = () => cb(payload);
    app.innerHTML = `<div class="card"><h2>${esc(Q.name)} xong</h2>
      <p>${Q.c}/${total} câu đúng (${pct}%)</p>
      <button class="btn" onclick="NEXT_STAGE()">Tiếp tục</button></div>`;
    return;
  }
  const review = Q.wrong.length
    ? `<h3>Các câu sai (${Q.wrong.length})</h3>` + Q.wrong.map(w =>
        `<div class="exp" style="background:#fff7ed"><b>${esc(w.q)}</b><br>Đáp án đúng: ${esc(w.o[w.a])}<br>${esc(w.e)}</div>`).join('')
    : '<p>Bạn không làm sai câu nào.</p>';
  const msg = pct >= 85 ? 'Rất tốt, hãy giữ nhịp độ này.'
            : pct >= 60 ? 'Khá ổn. Hãy xem lại các câu sai và phần giải thích.'
            : 'Cần ôn thêm. Hãy đọc kỹ giải thích trước khi làm lại.';
  app.innerHTML = `<div class="card">
    <div class="ring" style="--p:${pct};--c:${pct >= 85 ? 'var(--mint)' : pct >= 60 ? 'var(--indigo)' : 'var(--coral)'}"><b>${pct}%</b></div>
    <h2>Kết quả: ${Q.c}/${total} (${pct}%)</h2>
    <p class="muted">${msg}</p>
    ${review}
    <button class="btn" onclick="Q.again()">Làm lại</button>
    <button class="btn alt" onclick="route('${Q.back}')">Quay về</button></div>`;
}

/* =========================================================
   CÁC CHẾ ĐỘ LUYỆN
   ========================================================= */
function grammarQuiz(){ startQuiz('Ngữ pháp', GRAMMAR, 'quiz', 'grammar', false, 0, grammarQuiz); }
function readingQuiz(){ startQuiz('Đọc hiểu', READING_QS, 'reading', 'reading', false, 0, readingQuiz, {keepSets: true}); }
function listenQuiz(){
  startQuiz('Nghe', [1,2,3,4].flatMap(poolFor), 'lq', 'listen', false, 0, listenQuiz,
            {keepSets: true, strict: realListen()});
}
function listenView(){
  app.innerHTML = `<div class="card"><b>Part 1–4 · Nghe</b>
    <p class="muted">Chế độ thi thật: Part 1–2 chỉ có đáp án bằng tiếng, bài nghe phát một lần, không có nút nghe lại.</p>
    <label><input type="checkbox" ${realListen() ? 'checked' : ''} onchange="toggleRealListen(this.checked)"> Chế độ thi thật</label>
    <p><button class="btn" onclick="listenQuiz()">Bắt đầu</button></p></div>`;
}
function realListen(){ return S.settings.realListen !== false; }
function toggleRealListen(on){ S.settings.realListen = !!on; save(); listenView(); }
function mockTest(){ startQuiz('Thi thử 12 câu (15 phút)', shuffle(GRAMMAR).slice(0,12), 'quiz', 'mock', true, 15, mockTest); }

/* ---- Thi đầy đủ: Nghe 45 phút rồi Đọc 75 phút, đề theo số câu chuẩn ---- */
const TEST_PLAN = {1:6, 2:25, 3:39, 4:30, 5:30, 6:16, 7:54};
function pickFor(n){
  const target = TEST_PLAN[n];
  const groups = shuffle(groupSets(poolFor(n)));
  const chosen = [];
  let count = 0;
  for (const g of groups) { if (count >= target) break; chosen.push(g); count += g.length; }
  const out = chosen.flat();
  const trimmable = chosen.every(g => g.length === 1);
  return trimmable && out.length > target ? out.slice(0, target) : out;   // bộ câu nhiều câu giữ nguyên, không cắt
}
function fullTestPlan(){
  const parts = {};
  [1,2,3,4,5,6,7].forEach(n => { parts[n] = pickFor(n); });
  const short = [1,2,3,4,5,6,7].filter(n => parts[n].length < TEST_PLAN[n]).map(n => ({n, have: parts[n].length, want: TEST_PLAN[n]}));
  return {listen: [1,2,3,4].flatMap(n => parts[n]), reading: [5,6,7].flatMap(n => parts[n]), short};
}
function fullTestView(){
  const plan = fullTestPlan();
  const note = plan.short.length
    ? `<p style="color:#b45309">Ngân hàng chưa đủ câu: ${plan.short.map(x => `Part ${x.n} còn ${x.have}/${x.want}`).join('; ')}. Đề sẽ ngắn hơn đề chuẩn.</p>` : '';
  app.innerHTML = `<div class="card"><h2>Thi thử đầy đủ</h2>
    <p>Gồm hai phần: Nghe (Part 1–4, 45 phút) và Đọc (Part 5–7, 75 phút). Phần nghe phát một lần và không quay lại câu trước. Phần đọc được quay lại câu trước. Đáp án chỉ hiện ở cuối mỗi phần.</p>
    <p class="muted">Số câu: Nghe ${plan.listen.length}, Đọc ${plan.reading.length}.</p>
    ${note}
    <button class="btn" onclick="startFullTest()">Bắt đầu thi</button></div>`;
}
function startFullTest(){
  const plan = fullTestPlan();
  const res = {};
  const reading = () => startQuiz('Phần Đọc (Part 5–7)', plan.reading, 'reading', 'fulltest', true, 75, startFullTest,
    {keepOrder: true, allowBack: true, onDone: r => { res.R = r; fullResultView(res); }});
  startQuiz('Phần Nghe (Part 1–4)', plan.listen, 'lq', 'fulltest', true, 45, startFullTest,
    {keepOrder: true, strict: true, onDone: r => { res.L = r; reading(); }});
}
/* Điểm ước lượng tuyến tính theo tỷ lệ đúng: mỗi phần 5–495, tổng 10–990. Không phải bảng quy đổi chính thức. */
const scaleScore = (c, t) => t ? Math.round(5 + 490 * c / t) : 5;
function fullResultView(res){
  const L = res.L, R = res.R;
  const Ls = scaleScore(L.c, L.total), Rs = scaleScore(R.c, R.total), tot = Ls + Rs;
  S.mocks = [{date: new Date().toLocaleString('vi-VN'), L: L.c, LT: L.total, R: R.c, RT: R.total, Ls, Rs, tot}, ...S.mocks].slice(0, 20);
  save();
  app.innerHTML = `<div class="card"><h2>Kết quả thi thử</h2>
    <p>Nghe: ${L.c}/${L.total} câu đúng (ước lượng ${Ls}/495)</p>
    <p>Đọc: ${R.c}/${R.total} câu đúng (ước lượng ${Rs}/495)</p>
    <p><b>Tổng ước lượng: ${tot}/990</b></p>
    <p class="muted">Đây là điểm ước lượng theo tỷ lệ đúng, không phải điểm thi thật và không phải bảng quy đổi chính thức.</p>
    <button class="btn" onclick="startFullTest()">Thi lại</button>
    <button class="btn alt" onclick="route('home')">Về trang chủ</button></div>`;
}

/* ---- Phân tích: theo Part và theo dạng câu, cùng danh sách câu đến hạn ôn ---- */
function analysisView(){
  const now = Date.now();
  const byPart = {}, byType = {};
  Object.values(S.qstats).forEach(s => {
    const p = s.p || 0;
    byPart[p] = byPart[p] || {seen:0, wrong:0};
    byPart[p].seen += s.seen; byPart[p].wrong += s.wrong;
    if (s.t) {
      const k = p + '|' + s.t;
      byType[k] = byType[k] || {p, t: s.t, seen:0, wrong:0};
      byType[k].seen += s.seen; byType[k].wrong += s.wrong;
    }
  });
  const acc = x => x.seen ? Math.round((x.seen - x.wrong) / x.seen * 100) + '%' : '—';
  const accNum = x => x.seen ? (x.seen - x.wrong) / x.seen : 1;
  const dueN = Object.values(S.qstats).filter(s => s.wrong > 0 && (s.due || 0) <= now).length;
  const partRows = Object.entries(byPart).filter(([p]) => p !== '0').sort((a, b) => a[0] - b[0])
    .map(([p, x]) => `<tr><td>Part ${p}</td><td>${x.seen}</td><td>${acc(x)}</td></tr>`).join('');
  const typeRows = Object.values(byType).sort((a, b) => accNum(a) - accNum(b))
    .map(x => `<tr><td>Part ${x.p} · ${esc(x.t)}</td><td>${x.seen}</td><td>${acc(x)}</td></tr>`).join('');
  const table = (head, rows) => rows
    ? `<table style="width:100%;border-collapse:collapse"><tr>${head.map(h => `<th style="text-align:left;padding:6px;border-bottom:1px solid #e2e8f0">${h}</th>`).join('')}</tr>${rows}</table>`
    : '<p class="muted">Chưa có dữ liệu.</p>';
  app.innerHTML = `<div class="card"><b>Phân tích</b>
    <p class="muted">Tỷ lệ đúng tính trên mọi lượt làm câu hỏi đã ghi nhận.</p>
    <h3>Theo Part</h3>${table(['Part', 'Lượt làm', 'Tỷ lệ đúng'], partRows)}
    <h3>Theo dạng câu (yếu nhất trước)</h3>${table(['Dạng câu', 'Lượt làm', 'Tỷ lệ đúng'], typeRows)}
    <p style="margin-top:12px">Câu sai đang đến hạn ôn: <b>${dueN}</b></p>

      <div style="margin-top:6px">

      </div>
      <div id="res"></div>
    </div>`;

const words = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean);
function checkD(){
  const user = words(document.getElementById('ans').value), target = words(lcur);
  const bag = {}; user.forEach(w => bag[w] = (bag[w]||0) + 1);
  const missing = []; let hit = 0;
  target.forEach(w => { if (bag[w] > 0) { bag[w]--; hit++; } else missing.push(w); });
  const pct = Math.round(hit/target.length*100);
  S.listen.done++; S.listen.score += pct; save();
  document.getElementById('res').innerHTML = `<div class="exp"><b>Đúng khoảng ${pct}%</b><br>Câu gốc: ${esc(lcur)}<br>${missing.length ? 'Thiếu hoặc sai: ' + missing.map(esc).join(', ') : 'Chép đúng hoàn toàn!'}</div>`;
}

function importData(f){
  if (!f) return;
  if (f.size > 1024 * 1024) { alert('File quá lớn (tối đa 1 MB).'); return; }
  if (f.type && f.type !== 'application/json') { alert('Chỉ nhận file .json.'); return; }
  const r = new FileReader();
  r.onload = () => {
    try { S = sanitize(JSON.parse(r.result)); save(); route('home'); }
    catch(e) { alert('File không hợp lệ.'); }
  };
  r.readAsText(f);
}

function importPack(f){
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { alert('File quá lớn (tối đa 2 MB).'); return; }
  const r = new FileReader();
  r.onload = () => {
    let raw;
    try { raw = JSON.parse(r.result); } catch(e) { alert('File không phải JSON hợp lệ.'); return; }
    const res = validatePack(raw);
    PACK_ERRORS = res.errors;
    const n = Object.keys(res.pack.words).length + res.pack.qs.length;
    if (!n) { contentView(); alert('Không có mục hợp lệ nào để nhập. Xem danh sách lỗi.'); return; }
    S.pack = res.pack; save(); buildVocab(); CHECK_SAMPLE = null; contentView();
  };
  r.readAsText(f);
}
function clearPack(){
  if (!S.pack) return;
  if (!confirm('Xóa gói nội dung đã nhập? Tiến độ học vẫn được giữ.')) return;
  S.pack = null; PACK_ERRORS = []; save(); buildVocab(); contentView();
}
function sampleCheck(){
  const items = [];
  const add = (text, src) => items.push({text, src});
  const pools = [PACK_FILE, S.pack].filter(Boolean);
  pools.forEach(p => {
    Object.entries(p.words).forEach(([w, e]) => {
      e.ex.forEach(x => add(w + ': ' + x.t, x.src));
      e.col.forEach(x => add(w + ' – cụm: ' + x.t, x.src));
      e.conf.forEach(x => add(w + ' – dễ nhầm ' + x.w + ': ' + x.note, x.src));
    });
    p.qs.filter(q => !q.ver).forEach(q => add('Part ' + q.partNo + ': ' + (q.q || q.ts).slice(0, 120), q.src));
  });
  if (!items.length) { alert('Chưa có nội dung để lấy mẫu.'); return; }
  CHECK_SAMPLE = shuffle(items).slice(0, Math.max(5, Math.ceil(items.length * 0.1)));
  contentView();
}

const AI_KEY_STORE = 'toeic850-apikey';
const AI_SYSTEM = 'Bạn là gia sư luyện thi TOEIC. Trả lời bằng tiếng Việt, rõ ràng và ngắn gọn. Khi giải thích câu hỏi, nêu đáp án, lý do và bẫy thường gặp. Khi dạy từ vựng, cho nghĩa, loại từ, cách đọc và một câu ví dụ tiếng Anh.';
let chatMsgs = [];
let chatBusy = false;

function renderMsg(m){

  return `<div style="align-self:${mine ? 'flex-end' : 'flex-start'};max-width:85%;background:${mine ? '#dbeafe' : '#f1f5f9'};padding:10px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.5">${esc(m.content)}</div>`;

  app.innerHTML = `

function saveKey(){
  const k = document.getElementById('apikey').value.trim();
  if (!k) { alert('Hãy nhập API key.'); return; }
  localStorage.setItem(AI_KEY_STORE, k);
  chatView();
}
function clearKey(){ localStorage.removeItem(AI_KEY_STORE); chatView(); }

async function sendChat(){
  if (chatBusy) return;
  const input = document.getElementById('chatin');
  const text = input.value.trim();
  const key = localStorage.getItem(AI_KEY_STORE);
  if (!text) return;
  if (!key) { alert('Hãy nhập và lưu API key trước.'); return; }

  const model = document.getElementById('model').value;
  chatMsgs.push({role:'user', content:text});
  const pending = {role:'assistant', content:'Đang trả lời...'};
  chatMsgs.push(pending);
  input.value = '';
  chatBusy = true;
  chatView();

  // Chỉ gửi 12 tin gần nhất, bắt đầu bằng tin của người dùng
  let hist = chatMsgs.filter(m => m !== pending).slice(-12);
  while (hist.length && hist[0].role !== 'user') hist = hist.slice(1);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({model, max_tokens: 1024, system: AI_SYSTEM,
                            messages: hist.map(m => ({role: m.role, content: m.content}))})
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
    pending.content = data.content.filter(c => c.type === 'text').map(c => c.text).join('\n') || '(Không có nội dung)';
  } catch (e) {
    pending.content = 'Lỗi: ' + e.message + '\nKiểm tra lại API key và kết nối mạng.';
  }
  chatBusy = false;
  if (document.getElementById('chatlog')) chatView();
}

  [/^(danh từ|động từ|tính từ|trạng từ|giới từ|cụm từ) · (.+)$/g, (m, p, t) => `${POS_EN[p]} · ${TOPIC_EN[t] || t}`]

function tr(s){
  if (LANG !== 'en') return s;
  const k = s.trim();
  if (!k) return s;
  if (UI_EN[k]) return s.replace(k, UI_EN[k]);
  let out = k;
  UI_PATTERNS.forEach(([re, rep]) => { out = out.replace(re, rep); });
  return out === k ? s : s.replace(k, out);
}
function translateTree(root){
  if (!root || LANG !== 'en') return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { const t = tr(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; });
  root.querySelectorAll('[placeholder]').forEach(el => {
    const p = UI_EN[el.getAttribute('placeholder')];
    if (p) el.setAttribute('placeholder', p);
  });
}
const langObserver = new MutationObserver(() => {
  langObserver.disconnect();
  translateTree(document.getElementById('app'));
  translateTree(document.getElementById('nav'));
  translateTree(document.getElementById('tabs'));
  langObserver.takeRecords();
  langObserver.observe(document.body, {childList:true, subtree:true, characterData:true});
});
function applyLangUI(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'vi';
  document.getElementById('langbtn').textContent = LANG === 'en' ? 'VI' : 'EN';
}
function toggleLang(){
  LANG = LANG === 'en' ? 'vi' : 'en';
  localStorage.setItem('toeic850-lang', LANG);
  applyLangUI();
  route(currentRoute);
}

applyLangUI();
langObserver.observe(document.body, {childList:true, subtree:true, characterData:true});
loadQuestions();
loadPack();
route('home');
</script>
</body>
</html>
